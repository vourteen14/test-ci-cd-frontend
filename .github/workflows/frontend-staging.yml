name: Frontend - Build & Push

on:
  push:
    branches: [ staging ]
    paths:
      - 'web-application/frontend/**'
      - '.github/workflows/frontend-staging.yml'
  pull_request:
    branches: [ staging ]
    paths:
      - 'web-application/frontend/**'
      - '.github/workflows/frontend-staging.yml'

env:
  DOCKER_IMAGE: vourteen14/heypico-frontend
  WORKING_DIRECTORY: web-application/frontend

jobs:
  check-changes:
    name: Check Frontend Changes
    runs-on: ubuntu-latest
    outputs:
      frontend-changed: ${{ steps.changes.outputs.frontend }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 2

    - name: Check for frontend changes
      id: changes
      run: |
        # Check if any frontend files changed in the last commit
        if git diff --name-only HEAD~1 HEAD | grep -E '^web-application/frontend/'; then
          echo "frontend=true" >> $GITHUB_OUTPUT
          echo "Frontend changes detected"
        else
          echo "frontend=false" >> $GITHUB_OUTPUT
          echo "No frontend changes detected"
        fi

  test:
    name: Run Frontend Tests
    runs-on: ubuntu-latest
    needs: check-changes
    
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: ${{ env.WORKING_DIRECTORY }}/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Run unit tests
      run: npm run test:ci
      continue-on-error: true
      env:
        CI: true

  build-and-push:
    name: Build & Push Frontend Docker Image
    runs-on: ubuntu-latest
    needs: [check-changes, test]
    if: needs.check-changes.outputs.frontend-changed == 'true' && github.ref == 'refs/heads/staging' && github.event_name == 'push'
    
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.DOCKER_IMAGE }}
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-
          type=raw,value=staging
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      id: build
      uses: docker/build-push-action@v5
      with:
        context: ${{ env.WORKING_DIRECTORY }}
        file: ${{ env.WORKING_DIRECTORY }}/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          VUE_APP_API_URL=${{ secrets.STAGING_API_URL }}
          NODE_ENV=staging
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64,linux/arm64
        no-cache: true

  notify:
    name: Notify Frontend Build Status
    runs-on: ubuntu-latest
    needs: [check-changes, test, build-and-push]
    if: always() && needs.check-changes.outputs.frontend-changed == 'true' && github.event_name == 'push'

    steps:
      - name: Notify result to Discord
        run: |
          JOB_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          if [ "${{ needs.build-and-push.result }}" == "success" ]; then
            MESSAGE="Frontend build successful.\nImage: ${{ env.DOCKER_IMAGE }}:staging\nBranch: ${{ github.ref_name }}\nAPI URL: ${{ vars.STAGING_API_URL || 'http://localhost:3080' }}"
          else
            MESSAGE="Frontend build failed.\nBranch: ${{ github.ref_name }}\nCheck logs: $JOB_URL"
          fi

          curl -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"$MESSAGE\"}"