version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: heypico-postgres
    environment:
      POSTGRES_DB: backend
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - heypico-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d backend"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./web-application/backend
      dockerfile: Dockerfile
    container_name: heypico-backend
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: backend
      DB_USER: postgres
      DB_PASSWORD: password
    volumes:
      - ./web-application/backend:/app
      - /app/node_modules
    networks:
      - heypico-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    command: sh -c "npm run migrate && npm run dev"

  frontend:
    build:
      context: ./web-application/frontend
      dockerfile: Dockerfile
      args:
        VUE_APP_API_URL: ${VUE_APP_API_URL}
    container_name: heypico-frontend
    networks:
      - heypico-network
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: heypico-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
      - "8443:443"
    networks:
      - heypico-network
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

networks:
  heypico-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local