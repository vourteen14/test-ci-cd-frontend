apiVersion: v1
kind: Service
metadata:
  name: {{ include "heypico-web-app.fullname" . }}-frontend
  labels:
    {{- include "heypico-web-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: {{ .Values.service.frontend.type }}
  ports:
    - port: {{ .Values.service.frontend.port }}
      targetPort: {{ .Values.service.frontend.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "heypico-web-app.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend